<title>VRAITH Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--bg:#09090c;--bg2:#12121a;--border:#222230;--gold:#c8a200;--red:#8b0000;--fg:#e0dcd0;--fg2:#8a8678;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Share Tech Mono',monospace;font-size:13px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:12px;}
h1{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);}
.sub{color:var(--fg2);font-size:.75rem;margin-bottom:10px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.toolbar label{color:var(--fg2);font-size:.75rem;}
.toolbar input[type=range]{width:100px;accent-color:var(--gold);}
.toolbar button{background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:4px 10px;cursor:pointer;font-family:inherit;font-size:.75rem;}
.toolbar button:hover{border-color:var(--gold);}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:.72rem;color:var(--fg2);}
.li{display:flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;flex-shrink:0;}
.sec-tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
.sec-tab{background:var(--bg2);border:1px solid var(--border);color:var(--fg2);padding:4px 12px;cursor:pointer;font-family:inherit;font-size:.75rem;}
.sec-tab.on{background:var(--red);border-color:var(--gold);color:var(--gold);}
#canvasWrap{overflow:hidden;border:1px solid var(--border);background:var(--bg2);cursor:crosshair;width:100%;height:400px;position:relative;}
canvas{display:block;}
#info{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.85);border:1px solid var(--border);padding:6px 10px;font-size:.72rem;color:var(--fg2);pointer-events:none;}
#info span{color:var(--fg);}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:10px;}
.stat{background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--red);padding:6px 10px;}
.stat-v{font-size:1.1rem;color:var(--gold);}
.stat-l{font-size:.7rem;color:var(--fg2);}
</style>

<h1>VRAITH</h1>
<div class="sub">Blueprint interactif — S1+S2+S3 | 240 TPS · BPM 200 · Extreme Demon | Drag pour scroller · Scroll pour zoomer</div>

<div class="sec-tabs" id="secTabs"></div>

<div class="toolbar">
  <label>Zoom</label>
  <input type="range" id="zoomSlider" min="8" max="40" value="18" oninput="setZoom(+this.value)">
  <span id="zoomVal">18px/bl</span>
  <button onclick="resetView()">Reset vue</button>
  <button onclick="toggleGrid()">Grille beats</button>
</div>

<div class="legend">
  <div class="li"><div class="dot" style="background:#33334a"></div>Bloc</div>
  <div class="li"><div class="dot" style="background:#cc2200"></div>Spike</div>
  <div class="li"><div class="dot" style="background:#ffcc00"></div>Orbe J</div>
  <div class="li"><div class="dot" style="background:#ff4400"></div>Orbe R</div>
  <div class="li"><div class="dot" style="background:#00cc44"></div>Orbe V</div>
  <div class="li"><div class="dot" style="background:#8800ff"></div>Portail</div>
  <div class="li"><div class="dot" style="background:rgba(255,50,50,.4)"></div>Faux sol</div>
  <div class="li"><div class="dot" style="background:rgba(0,200,255,.15)"></div>Zone x2</div>
  <div class="li"><div class="dot" style="background:rgba(255,100,0,.15)"></div>Zone x3</div>
</div>

<div id="canvasWrap">
  <canvas id="cv"></canvas>
  <div id="info">Bloc: <span id="iBloc">—</span> | Beat: <span id="iBeat">—</span> | Y: <span id="iY">—</span></div>
</div>
<div class="stats" id="stats"></div>

<script>
const VX={x1:10.386,x2:12.914,x3:15.600};
const BEAT=0.3;
const SECTIONS=[
  {id:'s1',name:'AWAKENING',color:'#c8a200',startBloc:0,  endBloc:270, mode:'Cube',speed:'x1'},
  {id:'s2',name:'DESCENT',  color:'#8800ff',startBloc:258,endBloc:540, mode:'Ship',speed:'x3'},
  {id:'s3',name:'CORRUPTION',color:'#00aacc',startBloc:537,endBloc:810,mode:'Wave',speed:'x2'},
];
const SPEED_ZONES=[
  {xS:0,  xE:105,c:'rgba(255,255,255,0.03)'},
  {xS:105,xE:258,c:'rgba(0,200,255,0.06)'},
  {xS:258,xE:537,c:'rgba(255,100,0,0.09)'},
  {xS:537,xE:690,c:'rgba(0,200,255,0.06)'},
  {xS:690,xE:810,c:'rgba(255,100,0,0.09)'},
];

const OBJ=[];
function add(type,bx,by,g){OBJ.push({type,bx:+bx,by:+by,g:g||0});}

// ── Section 1 ─────────────────────────────────────────────
for(let i=0;i<=270;i++) add('block',i,0);
for(let i=4;i<29;i++) add('block',i,4);
add('spike',5,1);add('spike',9,1);add('orb_y',12,2);
add('spike',15,3);add('spike',18,1);
add('spike',21,1);add('spike',21,3);
add('orb_g',24,2);add('spike',27,1);
for(let c=30;c<36;c++){add('block',c,1);add('block',c,2);}
add('spike',33,3);
for(let i=30;i<37;i++) add('block',i,4);
add('orb_y',37,4);
for(let i=37;i<45;i++) add('block',i,5);
add('spike',40,2);add('spike',43,2);
add('orb_r',48,2);
for(let i=49;i<55;i++) add('block',i,3);
add('spike',51,1);add('spike',54,2);
add('spike',60,1);add('spike',63,1);add('spike',66,1);
add('orb_y',69,2);
for(let i=70;i<76;i++) add('block',i,5);
add('spike',72,1);add('spike',72,4);
for(let i=78;i<84;i++) add('block',i,0,12);
add('orb_y',81,1);add('alpha',76,1,12);
add('orb_y',90,4);add('orb_y',93,1);
add('spike',96,4);add('spike',99,1);add('orb_r',102,2);
add('portal_x2',105,1);
for(let i=106;i<115;i++) add('block',i,6);
add('spike',109,1);add('spike',113,1);
add('orb_y',117,4);add('orb_y',119,1);
for(let i=121;i<134;i++) add('block',i,4);
add('spike',121,3);add('spike',125,1);add('spike',129,3);
for(let r=0;r<3;r++) add('block',133,r);add('spike',133,3);
for(let r=0;r<4;r++) add('block',137,r);add('spike',137,4);
for(let r=0;r<5;r++) add('block',141,r);add('spike',141,5);
for(let i=141;i<150;i++) add('block',i,6);
add('orb_g',145,3);add('orb_g',149,5);
for(let i=153;i<163;i++) add('block',i,0,13);
add('alpha',149,1,13);
add('orb_y',157,1);add('orb_y',161,3);
add('orb_r',165,2);add('spike',169,1);
for(let i=173;i<191;i++) add('block',i,3);
add('spike',173,1);add('spike',177,1);add('spike',181,2);add('spike',185,1);
add('orb_y',190,2);add('orb_r',194,3);add('orb_y',198,1);
add('spike',202,1);add('spike',205,2);
add('spike',210,1);add('spike',214,1);add('spike',218,2);
add('orb_r',222,2);add('orb_y',226,5);
for(let i=230;i<238;i++) add('block',i,3);
add('spike',232,2);add('spike',236,1);
add('orb_y',248,1);
add('portal_ship',258,1);add('portal_x3',258,1);

// ── Section 2 ─────────────────────────────────────────────
for(let i=258;i<=540;i++) add('block',i,0);
for(let i=258;i<278;i++) add('block',i,7);
for(let i=278;i<288;i++) add('block',i,6);
for(let i=288;i<298;i++) add('block',i,5);
add('spike',263,1);add('spike',268,1);
add('spike',273,6);add('spike',278,5);
add('spike',283,1);add('spike',283,4);
for(let i=298;i<370;i++) add('block',i,4);
[300,310,320].forEach(x=>add('spike',x,1));
[305,315,325].forEach(x=>add('spike',x,3));
add('grav_i',328,2);
[333,343].forEach(x=>add('spike',x,3));
[338,348].forEach(x=>add('spike',x,1));
add('grav_n',353,2);
add('spike',358,1);add('spike',363,3);
for(let i=370;i<450;i++) add('block',i,3);
add('spike',372,1);add('spike',375,2);add('spike',378,1);add('spike',383,2);
add('portal_mini',388,2);
for(let i=388;i<415;i++) add('block',i,2);
for(let k=0;k<5;k++) add('spike',391+k*5,1);
add('portal_norm',415,2);
for(let i=415;i<430;i++) add('block',i,3);
for(let i=430;i<450;i++) add('block',i,4);
[420,430,435,440].forEach((x,k)=>add('spike',x,k%2===0?1:3));
for(let i=450;i<510;i++) add('block',i,2);
add('grav_i',455,1);add('spike',458,1);add('spike',463,1);add('spike',468,1);
add('grav_n',473,1);add('spike',476,1);add('spike',481,1);
add('grav_i',486,1);add('spike',489,1);add('spike',494,1);
add('grav_n',499,1);
for(let i=510;i<530;i++) add('block',i,5);
for(let i=530;i<541;i++) add('block',i,7);
add('spike',515,1);add('spike',520,4);add('spike',525,1);add('spike',530,4);
add('portal_wave',537,3);add('portal_x2',537,3);

// ── Section 3 ─────────────────────────────────────────────
[[537,542,5],[541,546,4],[545,550,5],[549,554,3],[553,557,5],[557,561,3],
 [561,565,5],[565,569,3],[569,573,5],[573,577,3]].forEach(([a,b,h])=>{
  for(let i=a;i<b;i++) add('block',i,h);
});
add('spike',555,1);add('spike',559,2);add('spike',562,1);add('spike',567,2);
add('spike',570,1);add('spike',575,2);
for(let i=577;i<581;i++) add('block',i,3);add('spike',578,1);
for(let i=581;i<585;i++) add('block',i,2);add('spike',583,1);
for(let c=0;c<6;c++){
  let b=585+c*8;
  for(let i=b;i<b+4;i++) add('block',i,4);add('spike',b+1,1);
  for(let i=b+4;i<b+8;i++) add('block',i,2);add('spike',b+5,1);
}
for(let i=633;i<637;i++) add('block',i,5);
for(let i=637;i<660;i++) add('block',i,5);
[[637,2],[637,3],[639,3],[639,4],[641,2],[641,3]].forEach(([x,y])=>add('block',x,y));
for(let j=0;j<6;j++){let bx=643+j*8;[[0,2],[0,3],[2,3],[2,4],[4,2],[4,3]].forEach(([dx,y])=>add('block',bx+dx,y));}
add('portal_x3',690,3);
for(let i=690;i<730;i++) add('block',i,2);
for(let k=0;k<5;k++) add('spike',693+k*5,1);
for(let i=730;i<740;i++) add('block',i,5);
add('spike',731,1);add('spike',731,4);add('spike',735,1);add('spike',735,4);
add('portal_mini',740,1);
for(let i=740;i<780;i++) add('block',i,2);
for(let k=0;k<10;k++) add('spike',742+k*4,1);
add('portal_norm',780,1);
for(let i=780;i<810;i++) add('block',i,4);
add('spike',783,1);add('spike',788,3);add('spike',793,1);add('spike',798,3);add('spike',803,1);
add('portal_cube',808,2);add('portal_x2',808,2);

// ── Renderer ──────────────────────────────────────────────
const wrap=document.getElementById('canvasWrap');
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let px=18,camX=0,showGrid=true,curSec=0;
const COLS={block:'#33334a',spike:'#cc2200',orb_y:'#ffcc00',orb_r:'#ff4400',
  orb_g:'#00cc44',orb_b:'#00aaff',portal_ship:'#8800ff',portal_wave:'#00aaff',
  portal_cube:'#ffaa00',portal_x2:'rgba(0,200,255,.7)',portal_x3:'rgba(255,100,0,.7)',
  portal_mini:'#aaaaaa',portal_norm:'#aaaaaa',alpha:'rgba(255,50,50,.5)',
  grav_i:'#ff00aa',grav_n:'#00ffaa'};

function w2s(bx,by){return[bx*px-camX,cv.height-(by+1)*px];}
function s2b(sx,sy){return[(sx+camX)/px,(cv.height-sy)/px-1];}
function setZoom(v){px=v;document.getElementById('zoomVal').textContent=v+'px/bl';draw();}
function toggleGrid(){showGrid=!showGrid;draw();}
function resetView(){
  const s=SECTIONS[curSec];
  camX=Math.max(0,s.startBloc*px-20);
  draw();
}

function draw(){
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#12121a';ctx.fillRect(0,0,W,H);
  SPEED_ZONES.forEach(z=>{
    const x1=z.xS*px-camX,x2=z.xE*px-camX;
    if(x2<0||x1>W) return;
    ctx.fillStyle=z.c;ctx.fillRect(Math.max(0,x1),0,Math.min(W,x2)-Math.max(0,x1),H);
  });
  if(showGrid){
    const vx=VX[SECTIONS[curSec].speed]||VX.x1;
    const bb=vx*BEAT;
    let bs=Math.floor((camX/px)/bb)*bb;
    for(let b=bs;b<(camX+W)/px+bb;b+=bb){
      const sx=b*px-camX;if(sx<0||sx>W) continue;
      ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
    }
  }
  SECTIONS.forEach((s,idx)=>{
    const sx=s.startBloc*px-camX;
    if(sx>0&&sx<W){
      ctx.strokeStyle=s.color+'88';ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle=s.color;
      ctx.font='11px Rajdhani,sans-serif';
      ctx.fillText('S'+(idx+1)+':'+s.name,sx+4,20);
    }
  });
  OBJ.forEach(o=>{
    const[sx,sy]=w2s(o.bx,o.by),p=px;
    if(sx+p<0||sx>W||sy+p<0||sy>H) return;
    const col=COLS[o.type]||'#888';
    if(o.type==='block'){
      ctx.fillStyle=o.g?'rgba(255,50,50,0.4)':'#33334a';
      ctx.fillRect(sx,sy,p-1,p-1);
      if(o.g){ctx.strokeStyle='#ff5555';ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.strokeRect(sx,sy,p-1,p-1);ctx.setLineDash([]);}
    } else if(o.type==='spike'){
      ctx.fillStyle=col;ctx.beginPath();
      ctx.moveTo(sx,sy+p-1);ctx.lineTo(sx+p/2,sy);ctx.lineTo(sx+p-1,sy+p-1);
      ctx.closePath();ctx.fill();
    } else if(o.type.startsWith('orb_')){
      const r=p*.38;ctx.beginPath();ctx.arc(sx+p/2,sy+p/2,r,0,Math.PI*2);
      ctx.fillStyle=col+'33';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
    } else if(o.type.startsWith('portal_')){
      ctx.fillStyle=col;ctx.fillRect(sx,sy,3,p);
    } else if(o.type==='alpha'){
      ctx.fillStyle='rgba(255,50,50,.3)';ctx.fillRect(sx,sy,p-1,p-1);
      ctx.fillStyle='#ff5555';ctx.font=Math.max(7,p*.4)+'px monospace';ctx.fillText('α',sx+2,sy+p-3);
    } else if(o.type.startsWith('grav_')){
      ctx.strokeStyle=col;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sx,sy+p/2);ctx.lineTo(sx+p-1,sy+p/2);ctx.stroke();
      ctx.fillStyle=col;ctx.font=Math.max(7,p*.4)+'px monospace';
      ctx.fillText(o.type==='grav_i'?'↑':'↓',sx+2,sy+p-3);
    }
  });
  ctx.strokeStyle='rgba(200,160,0,.4)';ctx.lineWidth=1;
  const[,gy]=w2s(0,-0.05);ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
}

function renderStats(){
  const s=SECTIONS[curSec];
  const bl=s.endBloc-s.startBloc;
  const vx=VX[s.speed]||VX.x1;
  const sec=(bl/vx).toFixed(1);
  const beats=(bl/vx/BEAT).toFixed(0);
  const spk=OBJ.filter(o=>o.type==='spike'&&o.bx>=s.startBloc&&o.bx<=s.endBloc).length;
  const orb=OBJ.filter(o=>o.type.startsWith('orb_')&&o.bx>=s.startBloc&&o.bx<=s.endBloc).length;
  const prt=OBJ.filter(o=>o.type.startsWith('portal_')&&o.bx>=s.startBloc&&o.bx<=s.endBloc).length;
  const flp=OBJ.filter(o=>(o.type==='grav_i'||o.type==='grav_n')&&o.bx>=s.startBloc&&o.bx<=s.endBloc).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-v">${bl}</div><div class="stat-l">blocs</div></div>
    <div class="stat"><div class="stat-v">${sec}s</div><div class="stat-l">durée</div></div>
    <div class="stat"><div class="stat-v">${beats}</div><div class="stat-l">beats</div></div>
    <div class="stat"><div class="stat-v">${spk}</div><div class="stat-l">spikes</div></div>
    <div class="stat"><div class="stat-v">${orb}</div><div class="stat-l">orbes</div></div>
    <div class="stat"><div class="stat-v">${prt}</div><div class="stat-l">portails</div></div>
    <div class="stat"><div class="stat-v">${flp}</div><div class="stat-l">gravity flips</div></div>`;
}

const tabsEl=document.getElementById('secTabs');
SECTIONS.forEach((s,idx)=>{
  const b=document.createElement('button');
  b.className='sec-tab'+(idx===0?' on':'');
  b.textContent=`S${idx+1}: ${s.name} (${s.mode})`;
  b.onclick=()=>{
    curSec=idx;
    document.querySelectorAll('.sec-tab').forEach((x,i)=>x.classList.toggle('on',i===idx));
    resetView();renderStats();
  };
  tabsEl.appendChild(b);
});

let drag=false,lastMX=0;
wrap.addEventListener('mousedown',e=>{drag=true;lastMX=e.clientX;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(drag){camX-=(e.clientX-lastMX);if(camX<-20)camX=-20;draw();}
  lastMX=e.clientX;
  const r=wrap.getBoundingClientRect();
  const[bx,by]=s2b(e.clientX-r.left,e.clientY-r.top);
  const s=SECTIONS[curSec];const vx=VX[s.speed]||VX.x1;
  document.getElementById('iBloc').textContent=Math.floor(bx);
  document.getElementById('iBeat').textContent=(Math.floor(bx)/vx/BEAT).toFixed(1);
  document.getElementById('iY').textContent=Math.floor(by);
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  px=Math.max(8,Math.min(40,px+(e.deltaY>0?-1:1)));
  document.getElementById('zoomSlider').value=px;
  document.getElementById('zoomVal').textContent=px+'px/bl';
  draw();
},{passive:false});
let t0=null;
wrap.addEventListener('touchstart',e=>{t0=e.touches[0].clientX;});
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  camX-=e.touches[0].clientX-t0;if(camX<-20)camX=-20;
  t0=e.touches[0].clientX;draw();
},{passive:false});

new ResizeObserver(()=>{cv.width=wrap.clientWidth;cv.height=wrap.clientHeight;draw();}).observe(wrap);
cv.width=wrap.clientWidth;cv.height=wrap.clientHeight;
resetView();renderStats();
</script>
