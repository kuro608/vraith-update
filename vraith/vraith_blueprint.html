body{background:var(--bg);color:var(--fg);font-family:'Share Tech Mono',monospace;font-size:13px;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
#header{padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0;}

// ── CANVAS LOGIC ────────────────────────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let curSec = 0;
let zoom = 20; // px per bloc
let offsetX = 0;
let dragging = false, dragX0 = 0, offX0 = 0;
const FLOOR_Y = 8; // Y rows shown below canvas

function resize(){
  const wrap = document.getElementById('canvas-wrap');
  cv.width = wrap.clientWidth;
  cv.height = wrap.clientHeight - 28; // info bar
  draw();
}

function secColor(i){return SECTIONS[i].color;}

// Build tabs
const tabBar = document.getElementById('tabs');
// "ALL" tab
const allTab = document.createElement('div');
allTab.className='tab active';allTab.textContent='ALL';allTab.dataset.sec='-1';
tabBar.appendChild(allTab);
SECTIONS.forEach((s,i)=>{
  const t=document.createElement('div');
  t.className='tab';t.textContent=s.short;t.dataset.sec=i;
  t.style.borderBottomColor=s.color;
  tabBar.appendChild(t);
});
tabBar.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  curSec=parseInt(t.dataset.sec);
  if(curSec>=0){
    offsetX=SECTIONS[curSec].start;
  } else {
    offsetX=0;
  }
  draw();
});

function worldToCanvas(bx,by){
  const cx = (bx - offsetX)*zoom;
  const cy = cv.height - 28 - (by+1)*zoom;
  return [cx,cy];
}

function draw(){
  const W=cv.width, H=cv.height-28;
  ctx.fillStyle='#09090c';
  ctx.fillRect(0,0,W,H);

  const secRange = curSec<0 ? {start:0,end:2600} : SECTIONS[curSec];
  const bStart = secRange.start, bEnd = secRange.end;

  // Visible bloc range
  const visStart = offsetX;
  const visEnd = offsetX + Math.ceil(W/zoom) + 1;

  // ── Draw speed zones ──
  const allModes = curSec<0
    ? SECTIONS.flatMap(s=>s.modes)
    : SECTIONS[curSec].modes;
  allModes.forEach(m=>{
    const x0=(m.x0-offsetX)*zoom, x1=(m.x1-offsetX)*zoom;
    ctx.fillStyle=SPD_COLORS[m.speed]||'rgba(255,255,255,.03)';
    ctx.fillRect(x0,0,x1-x0,H);
  });

  // ── Grid ──
  ctx.strokeStyle='#1a1a26';
  ctx.lineWidth=.5;
  for(let bx=Math.floor(visStart);bx<=visEnd;bx++){
    const [cx]=worldToCanvas(bx,0);
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
  }
  for(let by=0;by<=10;by++){
    const [,cy]=worldToCanvas(0,by-1);
    ctx.beginPath();ctx.moveTo(0,cy+zoom);ctx.lineTo(W,cy+zoom);ctx.stroke();
  }

  // ── Beat grid ──
  const BPS=[0,0,3.116,3.874,4.680,5.760];
  ctx.strokeStyle='rgba(200,162,0,.15)';
  ctx.lineWidth=.8;
  const beatStep = BPS[3];
  if(beatStep>0){
    for(let beat=0;;beat++){
      const bx=bStart+beat*beatStep;
      if(bx>visEnd) break;
      if(bx<visStart) continue;
      const [cx]=worldToCanvas(bx,0);
      ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
    }
  }

  // ── Section boundaries ──
  SECTIONS.forEach((sec,i)=>{
    if(sec.start<visStart-1 || sec.start>visEnd) return;
    const [cx]=worldToCanvas(sec.start,0);
    ctx.strokeStyle=sec.color+'88';
    ctx.lineWidth=1.5;
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=sec.color+'cc';
    ctx.font='bold 11px Rajdhani,sans-serif';
    ctx.fillText(sec.short,cx+4,16);
  });

  // ── Objects ──
  const OBJ_FILTER = curSec<0 ? OBJS
    : OBJS.filter(o=>o.x>=bStart && o.x<=bEnd);

  OBJ_FILTER.forEach(obj=>{
    if(obj.x<visStart-1||obj.x>visEnd+1) return;
    const [cx,cy]=worldToCanvas(obj.x,obj.y);
    const sz=zoom;

    if(obj.t==='block'){
      ctx.fillStyle='#444466';
      ctx.fillRect(cx,cy,sz,sz);
      ctx.strokeStyle='#6666aa44';
      ctx.lineWidth=.5;
      ctx.strokeRect(cx,cy,sz,sz);
    }
    else if(obj.t==='spike'){
      ctx.fillStyle='#ff4444';
      ctx.beginPath();
      ctx.moveTo(cx,cy+sz);
      ctx.lineTo(cx+sz/2,cy);
      ctx.lineTo(cx+sz,cy+sz);
      ctx.closePath();ctx.fill();
    }
    else if(obj.t==='orb'){
      const cols={y:'#ffcc00',r:'#ff4444',b:'#4488ff',p:'#aa44ff'};
      ctx.fillStyle=cols[obj.c]||'#ffcc00';
      ctx.beginPath();ctx.arc(cx+sz/2,cy+sz/2,sz*.42,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ffffff55';ctx.lineWidth=1;ctx.stroke();
    }
    else if(obj.t==='portal'){
      ctx.strokeStyle='#00ffaa';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx+sz/2,cy);ctx.lineTo(cx+sz/2,cy+sz*2);ctx.stroke();
      if(obj.label && zoom>12){
        ctx.fillStyle='#00ffaacc';ctx.font='9px Share Tech Mono,monospace';
        ctx.fillText(obj.label,cx+sz/2+3,cy+sz*.6);
      }
    }
    else if(obj.t==='gravity'){
      ctx.strokeStyle=obj.dir==='inv'?'#ff8800':'#00aaff';ctx.lineWidth=1.5;
      ctx.setLineDash([3,2]);
      ctx.beginPath();ctx.moveTo(cx+sz/2,cy);ctx.lineTo(cx+sz/2,cy+sz*2);ctx.stroke();
      ctx.setLineDash([]);
      // Arrow
      const ay=obj.dir==='inv'?cy+4:cy+sz*2-4;
      const dy=obj.dir==='inv'?1:-1;
      ctx.fillStyle=ctx.strokeStyle;
      ctx.beginPath();ctx.moveTo(cx+sz/2-4,ay);ctx.lineTo(cx+sz/2,ay+6*dy);ctx.lineTo(cx+sz/2+4,ay);ctx.fill();
    }
  });

  // ── Floor line ──
  ctx.strokeStyle='#888888';ctx.lineWidth=1.5;ctx.setLineDash([]);
  const [,fy]=worldToCanvas(0,0);
  ctx.beginPath();ctx.moveTo(0,fy+zoom);ctx.lineTo(W,fy+zoom);ctx.stroke();

  updateStats();
}

function updateStats(){
  const sec = curSec>=0 ? SECTIONS[curSec] : null;
  const sp=document.getElementById('stats-panel');
  if(!sec){
    const total=2600;
    sp.innerHTML=`<div style="font-family:Rajdhani,sans-serif;font-weight:700;color:var(--gold);margin-bottom:6px;letter-spacing:1px;">VRAITH TOTAL</div>

<div class=st-row><span>Sections</span><span class=st-val>9</span></div>
<div class=st-row><span>Modes</span><span class=st-val>14</span></div>
<div class=st-row><span>BPM</span><span class=st-val>200</span></div>
<div class=st-row><span>NG ID</span><span class=st-val>1633728</span></div>`;
  } else {
    const blocs=sec.end-sec.start;

    const portals=OBJS.filter(o=>o.t==='portal'&&o.x>=sec.start&&o.x<sec.end).length;

}

// ── MOUSE EVENTS ──
cv.addEventListener('mousedown',e=>{dragging=true;dragX0=e.clientX;offX0=offsetX;});
cv.addEventListener('mousemove',e=>{
  if(dragging){
    const dx=(e.clientX-dragX0)/zoom;
    offsetX=Math.max(0,offX0-dx);
    draw();
  }
  const rect=cv.getBoundingClientRect();
  const bx=Math.floor((e.clientX-rect.left)/zoom+offsetX);
  const by=Math.floor((cv.height-28-(e.clientY-rect.top))/zoom);
  document.getElementById('ib-bloc').textContent=bx;
  document.getElementById('ib-beat').textContent=(bx/3.874).toFixed(1);
  document.getElementById('ib-y').textContent=by;
  // Find mode
  const mode=SECTIONS.flatMap(s=>s.modes).find(m=>bx>=m.x0&&bx<m.x1);
  document.getElementById('ib-mode').textContent=mode?mode.label:'—';
});
cv.addEventListener('mouseup',()=>dragging=false);
cv.addEventListener('mouseleave',()=>dragging=false);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const mx=(e.clientX-rect.left);
  const bxAtMouse=mx/zoom+offsetX;
  zoom=Math.max(4,Math.min(60,zoom*(e.deltaY<0?1.12:0.89)));
  offsetX=bxAtMouse-mx/zoom;
  draw();
},{passive:false});
// Touch
let touchX0=0,touchZ0=1,offXT=0;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){touchX0=e.touches[0].clientX;offXT=offsetX;}
  if(e.touches.length===2){touchZ0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    offsetX=Math.max(0,offXT-(e.touches[0].clientX-touchX0)/zoom);draw();
  }
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zoom=Math.max(4,Math.min(60,zoom*(d/touchZ0)));touchZ0=d;draw();
  }
},{passive:false});

window.addEventListener('resize',resize);
resize();
</script>
